<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>任务中心与月结 · 零售经营工作站</title>
<script>
  // URL 参数 > 本地偏好 > 系统偏好。参数优先是为了让并排对比页能把两个
  // iframe 各自锁在一种风格上，而不受本地偏好干扰。
  try {
    var d = document.documentElement, p = new URLSearchParams(location.search);
    d.dataset.theme = p.get("theme") || localStorage.getItem("demo.theme") ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    d.dataset.skin = p.get("skin") || localStorage.getItem("demo.skin") || "restrained";
    if (p.get("embed")) d.dataset.embed = "1";
  } catch (e) { document.documentElement.dataset.theme = "light"; document.documentElement.dataset.skin = "restrained"; }
</script>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/app.css">
<style>
  /* 结账流程条：状态靠形状 + 文字，不只靠颜色 */
  .flow { display: flex; align-items: stretch; gap: var(--space-1); flex-wrap: wrap; }
  .flow__step {
    flex: 1 1 120px; min-width: 110px;
    padding: var(--space-2) var(--space-3);
    border-radius: var(--radius-control);
    background: var(--bg-inset);
    box-shadow: inset 0 0 0 1px var(--border-hairline);
  }
  .flow__step[data-state="done"]    { background: var(--success-bg); box-shadow: inset 0 0 0 1px var(--success-border); }
  .flow__step[data-state="active"]  { background: var(--info-bg);    box-shadow: inset 0 0 0 1px var(--info-border); }
  .flow__step[data-state="blocked"] { background: var(--error-bg);   box-shadow: inset 0 0 0 1px var(--error-border); }
  .flow__mark { font-size: var(--text-caption); font-weight: var(--weight-semibold); }
  .flow__step[data-state="done"]    .flow__mark { color: var(--success-fg); }
  .flow__step[data-state="active"]  .flow__mark { color: var(--info-fg); }
  .flow__step[data-state="blocked"] .flow__mark { color: var(--error-fg); }
  .flow__label { font-size: var(--text-small); color: var(--fg-primary); font-weight: var(--weight-medium); }
  .flow__note  { font-size: var(--text-micro); color: var(--fg-muted); }
</style>
</head>
<body>

<div class="shell">
  <main class="main">
    <div class="main__inner">

      <div class="page-head">
        <div>
          <h1 class="t-display">任务中心</h1>
          <p class="page-head__sub">
            统一收件箱：合同审批、事件复核、分录过账、关键日期、AI 行动建议全部落在同一个界面里。
            大型企业最贵的摩擦不是某个操作难用，而是同一个人要在五个子系统之间反复登录切换。
          </p>
        </div>
        <div class="row">
          <div class="segmented" role="group" aria-label="任务来源" id="source-filter">
            <button data-source="all" aria-pressed="true">全部</button>
            <button data-source="blocking" aria-pressed="false">仅阻断项</button>
            <button data-source="ai" aria-pressed="false">仅 AI 建议</button>
          </div>
        </div>
      </div>

      <div class="bento">

        <!-- 统一收件箱占 Hero：这是本页的主体 -->
        <div class="t-two-thirds">
          <section class="card card--flush">
            <div class="card__head card__body-pad" style="margin-bottom:0">
              <h2 class="card__title">收件箱</h2>
              <span class="t-caption fg-muted" id="task-count"></span>
            </div>
            <div id="tasks"></div>
          </section>
        </div>

        <!-- 结账就绪度 -->
        <div class="t-third">
          <section class="card" style="height:100%">
            <div class="card__head">
              <h2 class="card__title" id="closing-title">结账就绪度</h2>
              <span class="tag tag--error" id="closing-status"></span>
            </div>
            <p class="t-caption fg-muted" id="closing-entity" style="margin-bottom:var(--space-4)"></p>

            <div class="row" style="gap:var(--space-6);align-items:flex-end;margin-bottom:var(--space-4)">
              <div>
                <div class="t-micro fg-muted">评估覆盖</div>
                <div class="kpi__value" id="closing-evaluated"></div>
              </div>
              <div>
                <div class="t-micro fg-muted">阻断项</div>
                <div class="kpi__value" id="closing-blocked" style="color:var(--error-fg)"></div>
              </div>
            </div>

            <div class="coverage-bar" data-tone="warning" style="margin-bottom:var(--space-2)" aria-hidden="true">
              <span class="coverage-bar__fill" id="closing-bar"></span>
            </div>
            <p class="t-caption fg-muted" id="closing-note"></p>

            <hr class="hr">

            <div class="eyebrow" style="margin-bottom:var(--space-2)">未评估的对象</div>
            <ul class="stack" style="gap:var(--space-2)" id="not-evaluated"></ul>

            <div class="note note--warning" style="margin-top:var(--space-4)">
              <b>每一个「未评估」都必须带原因和负责人。</b>
              把口径缩小到只剩已评估对象，可以让这个数字变成 108/108——那不是结账完成，
              那是把问题藏起来。
            </div>
          </section>
        </div>

        <!-- 结账流程 -->
        <div class="t-full">
          <section class="card">
            <div class="card__head">
              <h2 class="card__title">结账流程</h2>
              <span class="t-caption fg-muted" id="closing-evaluated-at"></span>
            </div>
            <div class="flow" id="flow"></div>
            <div class="note note--neutral" style="margin-top:var(--space-3)">
              过账被阻断，后面两步保持"未开始"而不是"待办"——在前置条件不成立时把后续步骤
              显示成可点击的待办，是审批类界面里最常见的一种善意误导。
            </div>
          </section>
        </div>

      </div>

    </div>
  </main>
</div>

<script src="assets/data.js"></script>
<script src="assets/charts.js"></script>
<script src="assets/app.js"></script>
<script>
App.mount({ page: "tasks", crumbs: ["日常工作", "任务中心"] });

const C = DEMO.closing;
let sourceFilter = "all";

/* ── 结账就绪度 ───────────────────────────────────────────────────── */

document.getElementById("closing-title").textContent = `${C.period} 结账就绪度`;
document.getElementById("closing-status").textContent = C.statusLabel;
document.getElementById("closing-entity").textContent = C.entity;
document.getElementById("closing-evaluated").innerHTML =
  `${C.evaluated}<span class="t-h2 fg-muted">/${C.population}</span>`;
document.getElementById("closing-blocked").textContent = C.not_evaluated.length;
document.getElementById("closing-bar").style.width =
  `${((C.evaluated / C.population) * 100).toFixed(1)}%`;
document.getElementById("closing-note").textContent =
  `${((C.evaluated / C.population) * 100).toFixed(1)}% 的关闭群体已评估。剩余 ${C.not_evaluated.length} 个对象阻断期间锁定。`;
document.getElementById("closing-evaluated-at").textContent = `评估于 ${C.evaluated_at}`;

document.getElementById("not-evaluated").innerHTML = C.not_evaluated
  .map((n) => `
    <li class="row row--top" style="gap:var(--space-2)">
      <span class="sev sev--high" aria-hidden="true"><span class="sev__dot"></span></span>
      <span class="grow" style="min-width:0">
        <span class="t-small fg-primary truncate" style="display:block">${n.subject}</span>
        <span class="t-caption fg-muted">${n.reason}</span>
      </span>
      <span class="t-caption fg-tertiary">${n.owner}</span>
    </li>`)
  .join("");

/* ── 结账流程 ─────────────────────────────────────────────────────── */

const STEP_MARK = { done: "✓ 已完成", active: "▸ 进行中", blocked: "✕ 阻断", todo: "· 未开始" };
const STEP_NOTE = {
  prepare: "112 个对象已归集",
  calculate: "108 个对象已计量",
  review: "复核中 · 负责人 王予彤",
  post: "4 个对象未评估",
  writeback: "等待过账完成",
  lock: "等待 ERP 回写完成",
};

document.getElementById("flow").innerHTML = C.steps
  .map((step) => `
    <div class="flow__step" data-state="${step.state}">
      <div class="flow__mark">${STEP_MARK[step.state]}</div>
      <div class="flow__label">${step.label}</div>
      <div class="flow__note">${STEP_NOTE[step.key]}</div>
    </div>`)
  .join("");

/* ── 统一收件箱 ───────────────────────────────────────────────────── */

const SLA_KIND = { critical: "error", high: "warning", medium: "neutral", low: "neutral" };

function visibleTasks() {
  if (sourceFilter === "blocking") return DEMO.tasks.filter((t) => t.severity === "critical" || t.severity === "high");
  if (sourceFilter === "ai") return DEMO.tasks.filter((t) => t.ai);
  return DEMO.tasks;
}

function taskHTML(task) {
  return `
    <div class="task-item" data-task="${task.id}">
      <span class="sev sev--${task.severity}" aria-hidden="true"><span class="sev__dot"></span></span>
      <div style="min-width:0">
        <div class="task-item__source">
          ${task.source}
          ${task.ai ? `<span class="tag tag--info" style="margin-left:var(--space-1)">AI 生成</span>` : ""}
        </div>
        <div class="task-item__title">${task.title}</div>
        <div class="task-item__meta">${task.meta}</div>
      </div>
      <div class="task-item__actions">
        <span class="tag tag--${SLA_KIND[task.severity]}">${task.sla}</span>
        ${task.actions.map((a, i) => `
          <button class="btn btn--sm${i === 0 ? " btn--primary" : ""}" data-act="${a}">${a}</button>`).join("")}
      </div>
    </div>`;
}

function renderTasks() {
  const rows = visibleTasks();
  document.getElementById("tasks").innerHTML = rows.length
    ? rows.map(taskHTML).join("")
    : `<div class="state"><div class="state__title">这个筛选下没有任务</div>
       <div class="state__hint">切回「全部」查看其余 ${DEMO.tasks.length} 项。</div></div>`;
  document.getElementById("task-count").textContent = `${rows.length} / ${DEMO.tasks.length} 项`;

  document.querySelectorAll("[data-act]").forEach((btn) =>
    btn.addEventListener("click", (event) => {
      const item = event.target.closest(".task-item");
      const action = btn.dataset.act;
      // 乐观 UI：先把结果画出来，再异步确认
      item.style.opacity = "0.45";
      App.toast(`${action}中…`);
      setTimeout(() => {
        item.remove();
        App.toast(`已${action}，并记入审计日志`);
      }, 700);
    })
  );
}

document.getElementById("source-filter").addEventListener("click", (event) => {
  const btn = event.target.closest("[data-source]");
  if (!btn) return;
  sourceFilter = btn.dataset.source;
  document.querySelectorAll("#source-filter [data-source]").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.dataset.source === sourceFilter))
  );
  renderTasks();
});

App.filterHandlers = {
  severity: () => {
    sourceFilter = "blocking";
    document.querySelectorAll("#source-filter [data-source]").forEach((b) =>
      b.setAttribute("aria-pressed", String(b.dataset.source === "blocking"))
    );
    renderTasks();
    App.toast("已筛选：仅阻断项");
  },
  window: () => App.toast("任务中心没有对比窗口"),
  classification: () => App.toast("任务数据始终为正式数据"),
};

renderTasks();
</script>
</body>
</html>
