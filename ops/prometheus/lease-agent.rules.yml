groups:
  - name: lease-agent-runtime
    interval: 30s
    rules:
      - alert: LeaseAgentToolFailureRateHigh
        expr: |
          lease_agent:tool_failure_ratio:5m > 0.20
        for: 10m
        labels:
          severity: warning
          service: lease-agent
        annotations:
          summary: "Agent Tool failure/rejection rate is high"
          description: "More than 20% of Tool attempts failed or were rejected for ten minutes."

      - alert: LeaseAgentToolLatencyHigh
        expr: |
          lease_agent:tool_average_latency_seconds:5m > 5
        for: 10m
        labels:
          severity: warning
          service: lease-agent
        annotations:
          summary: "Agent Tool average latency is high"
          description: "Average Tool Runtime latency is above five seconds for ten minutes."

      - alert: LeaseAgentCostAccountingUnavailable
        expr: lease_agent_tool_cost_accounting_available == 0
        for: 30m
        labels:
          severity: info
          service: lease-agent
        annotations:
          summary: "Agent cost accounting is unavailable"
          description: "This is expected until the model pricing book is configured; do not infer cost from token counts alone."

      - alert: LeaseAgentContextOccupancyHigh
        expr: |
          (
            sum by (model) (rate(lease_agent_context_tokens_measured_total[5m]))
            +
            sum by (model) (rate(lease_agent_context_tokens_estimated_total[5m]))
          ) / clamp_min(lease_agent_context_budget_tokens, 1) > 0.80
        for: 10m
        labels:
          severity: warning
          service: lease-agent
        annotations:
          summary: "Context budget occupancy is persistently high"
          description: "Measured+estimated context tokens are running at 80%+ of the per-model effective budget for ten minutes. This is the pre-compaction warning — inspect occupancy data before enabling compaction, or tune the budget."
